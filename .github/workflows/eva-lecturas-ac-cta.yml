name: EVA - validar CTA de Lecturas inclusivas AC
on:
  pull_request:
    paths:
      - 'index.html'
      - 'eva-identidad-ac-ra.css'
      - 'eva-botones-body.css'
      - 'eva-lecturas-inclusivas.css'
      - 'eva-lecturas-inclusivas.js'
      - 'tests/eva-lectura-cta.browser.mjs'
      - '.github/workflows/eva-lecturas-ac-cta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lecturas-ac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check tests/eva-lectura-cta.browser.mjs
      - run: node tests/eva-lectura-cta.browser.mjs
