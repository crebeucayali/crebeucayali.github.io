name: EVA - validar menú Más y cajón derecho
on:
  pull_request:
    paths:
      - 'index.html'
      - 'eva-menu-responsive.css'
      - 'eva-menu-responsive.js'
      - 'tests/eva-menu-mas.browser.mjs'
      - '.github/workflows/eva-menu-mas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check eva-menu-responsive.js
      - run: node --check tests/eva-menu-mas.browser.mjs
      - run: node tests/eva-menu-mas.browser.mjs
