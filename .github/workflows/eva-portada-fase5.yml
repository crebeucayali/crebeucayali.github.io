name: EVA portada - Fase 5 navegador aislado

on:
  push:
    branches:
      - feature/eva-portada-columna-lateral-fase2
      - fix/eva-actualidad-visible-movil
      - fix/eva-actualidad-sticky-escritorio
      - fix/eva-lateral-scroll-unico
    paths:
      - "index.html"
      - "eva-layout.css"
      - "eva-columna-lateral.js"
      - "tests/eva-portada-fase5-browser.cjs"
      - ".github/workflows/eva-portada-fase5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegadores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright sin navegador adicional
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Ejecutar prueba local sin publicar en Pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/eva-fase5-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          node tests/eva-portada-fase5-browser.cjs
      - name: Conservar capturas y resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eva-portada-fase5-browser
          path: test-results/eva-fase5/
          if-no-files-found: ignore
